# Review Board Genie agent, managed by this bundle.
# The definition lives in trb/genie/review_board.geniespace.json, generated by
# trb/genie/build_genie.py --catalog <catalog> (which also validates every SQL in it).
#
# WARNING: every deploy that changes the definition wipes the agent's benchmarks.
# After each deploy, run:  databricks bundle run review_board_genie_maintenance -t <target>
resources:
  genie_spaces:
    review_board_agent:
      title: Feature Tracker Review Board Analytics Space
      description: >-
        Answers questions about the Tech Review Board (TRB, also called the Architecture
        Review Board) decisions on Databricks features at Acme Health Plan: review status,
        PHI eligibility, approval conditions, exceptions, control mappings, meetings, and
        governance documents. For the platform team, security, privacy, and compliance
        reviewers. Data is synthetic.
      warehouse_id: ${var.genie_warehouse_id}
      parent_path: ${var.genie_parent_path}
      file_path: ../genie/review_board.geniespace.json
